<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钻孔灌注桩施工 · 工序挑战</title><style>
*{box-sizing:border-box}body{margin:0;background:#06162c;color:#edf8ff;font:16px 'Microsoft YaHei',sans-serif;background-image:radial-gradient(ellipse at top,#154270,transparent 60%)}main{max-width:1650px;margin:auto;padding:18px 2.5vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #276082;padding-bottom:12px;gap:16px}h1{font-size:clamp(25px,2.8vw,40px);margin:0}header p{color:#7cd9ee;margin:6px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(550px,1.12fr);gap:18px;margin-top:16px}.panel{background:#0a2342;border:1px solid #2b5d7b;border-radius:14px;padding:15px}.video{width:100%;aspect-ratio:16/9;background:#020b16;object-fit:contain;border-radius:9px}.small{color:#a9c6d9;font-size:14px;line-height:1.5}.video-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.video-title strong{font-size:19px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.toolbar button, .actions button{border:1px solid #4283a2;background:#173b5a;color:white;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}.actions button.primary{background:#007c9e;border-color:#3be0f5;font-weight:bold}.actions button:disabled{opacity:.45;cursor:not-allowed}h2{font-size:21px;margin:0 0 5px}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.step{display:flex;align-items:center;gap:8px;min-height:56px;border:1px solid #315b79;background:#102f4d;border-radius:9px;padding:8px;color:#d5ecf8;font:inherit;text-align:left;cursor:pointer}.step .num{font-weight:bold;color:#7dcde0;flex:none}.step .label{line-height:1.25;font-size:15px}.step.blank{border:1px dashed #47d4ef;background:#103e5c}.step.selected{outline:3px solid #4be6ff}.step.right{border-color:#45dfae;background:#10483f}.step.wrong{border-color:#ffb575;background:#523b32}.step:focus-visible,.option:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.option{background:#144867;border:1px solid #45b7ce;border-radius:8px;color:#e4faff;padding:10px 12px;font:inherit;cursor:pointer}.option.used{opacity:.42}.result{min-height:50px;background:#103450;border-radius:8px;padding:11px 13px;margin-top:12px;line-height:1.5;color:#cae9f5}.result.fail{background:#4a3528;color:#ffe0b3}.result.ok{background:#10483e;color:#b4fae2}.actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.progress{color:#a9c6d9;margin-left:auto}.foot{font-size:13px;color:#90adbf;margin-top:12px} @media(max-width:1050px){.layout{grid-template-columns:1fr}.steps{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}main{padding:12px}.layout{display:block}.panel{margin-top:12px}}@media(min-width:1051px) and (max-height:850px){main{padding-top:10px}h1{font-size:29px}.panel{padding:10px}.layout{margin-top:10px}.step{min-height:45px;padding:6px}.steps{gap:6px;margin:8px 0}.result{margin-top:8px;padding:8px}}
</style></head><body><main><header><div><h1>钻孔灌注桩施工工序挑战</h1><p>小小施工员 · 补全12步施工流程</p></div><div class="small">观察施工动画　·　完成工序考核</div></header><div class="layout"><section class="panel"><div class="video-title"><strong>施工动画</strong><span class="small" id="videoName">点击已显示的工序观看</span></div><video id="video" class="video" poster="assets/poster.jpg" controls playsinline preload="metadata"></video><p class="small">点击已显示的工序，可播放对应的动画片段。作答前留空工序的片段暂不开放，提交后可以查看。</p><p class="small">动画按本案例展示12个步骤；具体施工顺序和要求以工程设计及施工方案为准。</p></section><section class="panel"><h2>补全施工流程</h2><div class="small">先点击一个空位，再点击下方工序填入；可重新选择。全部填完后提交考核。</div><div class="steps" id="steps"></div><strong>待选工序</strong><div class="choices" id="choices"></div><div class="result" id="result" role="status" aria-live="polite">请选择一个空位开始。</div><div class="actions"><button class="primary" id="submit" disabled>提交考核</button><button id="reset">重新出题</button><span class="progress" id="progress"></span></div></section></div><div class="foot">课堂形成性评价：4个空位，每空25分；首次提交后显示正确答案，重新出题可再次练习。</div></main><script>
const names=['测量放样','泥浆池布置','钢护筒埋设','钻机就位','钻孔','成孔检查','清孔','钢筋笼制作与吊放','导管安装','二次清孔','灌注水下混凝土','拔出导管及钢护筒'];const stepsEl=document.querySelector('#steps'),choicesEl=document.querySelector('#choices'),result=document.querySelector('#result'),video=document.querySelector('#video'),videoName=document.querySelector('#videoName'),submit=document.querySelector('#submit');let blanks=[],choices=[],answers={},selected=null,submitted=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showVideo(i){video.src='assets/step'+String(i+1).padStart(2,'0')+'.mp4';videoName.textContent=names[i];video.play().catch(()=>{videoName.textContent=names[i]+' · 请点击播放'})}
function render(){stepsEl.replaceChildren();names.forEach((name,i)=>{const b=document.createElement('button'),blank=blanks.includes(i);b.type='button';b.className='step'+(blank?' blank':'')+(selected===i&&!submitted?' selected':'')+(submitted&&blank?(answers[i]===i?' right':' wrong'):'');let label=blank&&!submitted?(answers[i]===undefined?'点击填空':names[answers[i]]):name;b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="label"></span>';b.querySelector('.label').textContent=label;b.setAttribute('aria-label','第'+(i+1)+'步 '+label);b.addEventListener('click',()=>{if(blank&&!submitted){selected=i;result.className='result';result.textContent='已选择第'+(i+1)+'步，请从下方选择工序。';render()}else showVideo(i)});stepsEl.append(b)});choicesEl.replaceChildren();choices.forEach(i=>{const b=document.createElement('button');b.type='button';b.className='option'+(Object.values(answers).includes(i)?' used':'');b.textContent=names[i];b.disabled=submitted;b.addEventListener('click',()=>{if(selected===null){result.textContent='请先点击流程中的一个空位。';return}for(const k of Object.keys(answers))if(answers[k]===i)delete answers[k];answers[selected]=i;selected=null;result.className='result';result.textContent='已填入。请选择下一个空位，或修改已有答案。';render()});choicesEl.append(b)});let n=Object.keys(answers).length;document.querySelector('#progress').textContent='已填写 '+n+' / '+blanks.length;submit.disabled=submitted||n!==blanks.length}
submit.addEventListener('click',()=>{submitted=true;let right=blanks.filter(i=>answers[i]===i).length;let wrong=blanks.filter(i=>answers[i]!==i).map(i=>'第'+(i+1)+'步：'+names[i]);result.className='result '+(right===4?'ok':'fail');result.textContent='首次得分：'+(right*25)+'分（答对 '+right+' / 4）。'+(wrong.length?' 正确答案：'+wrong.join('；')+'。':' 全部正确！');selected=null;render()});
function reset(){video.pause();video.removeAttribute('src');video.load();videoName.textContent='点击已显示的工序观看';blanks=shuffle(names.map((_,i)=>i)).slice(0,4).sort((a,b)=>a-b);choices=shuffle(blanks);answers={};selected=null;submitted=false;result.className='result';result.textContent='请选择一个空位开始。';render()}document.querySelector('#reset').addEventListener('click',reset);reset();
</script></body></html>
