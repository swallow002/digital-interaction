<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>泥浆流向判断</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#153e62,#07182d 70%);color:#edf8ff;font-family:'Microsoft YaHei',sans-serif}main{max-width:1450px;margin:auto;padding:20px 3vw}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #356482;padding-bottom:14px;gap:12px}h1{margin:0;font-size:clamp(25px,2.8vw,40px)}header p{margin:5px 0 0;color:#a5c9dc}.btn{background:#183d59;color:white;border:1px solid #43869e;border-radius:9px;padding:11px 18px;font:inherit;cursor:pointer}h2{font-size:25px;margin:0 0 8px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{border:1px solid #376784;border-radius:14px;padding:18px;background:#0d2b49;box-shadow:0 14px 35px #0003}.card header{border:0;padding:0}.badge{font-size:14px;color:#8cdbed}.illustration{width:100%;aspect-ratio:12/7;object-fit:contain;border-radius:9px;margin:8px 0;background:#07182d}.question{font-size:19px;font-weight:bold;margin:10px 0}.choices{display:grid;gap:9px}.choice{background:#153c5c;border:1px solid #3a7691;border-radius:9px;padding:13px;color:#e7f8ff;cursor:pointer;text-align:left;font:inherit}.choice:hover,.choice:focus-visible{outline:2px solid #5de2f3}.choice.correct{background:#145846;border-color:#51e2ad}.choice.incorrect{background:#583d32;border-color:#ffb57e}.feedback{min-height:50px;padding:10px 12px;margin-top:10px;border-radius:8px;background:#10243d;color:#bdd8e7;line-height:1.5}.feedback.good{background:#10463b;color:#b9fae1}.feedback.bad{background:#51392e;color:#ffe1b7}.bottom{text-align:center;color:#a2c5d8;margin-top:15px;line-height:1.5}button:focus-visible{outline:3px solid #a6f5ff;outline-offset:2px}@media(max-width:750px){.layout{grid-template-columns:1fr}}@media(min-width:751px) and (max-height:850px){main{padding-top:10px}.card{padding:12px}.illustration{max-height:35vh}.choice{padding:9px}.question{margin:6px 0}.feedback{min-height:42px;padding:7px}}
</style></head><body><main><header><div><h1>泥浆从哪里走？</h1><p>观看动画，判断正循环与反循环的流向</p></div><button class="btn" id="reset">重新练习</button></header><div class="layout"><section class="card" data-kind="positive"><header><h2>正循环</h2><span class="badge">流向判断 01</span></header><img class="illustration" src="正循环.gif" alt="正循环钻孔示意：泥浆从钻杆内下行，携渣从钻杆与孔壁间上返"><div class="question">正循环时，泥浆从哪里进入孔底？</div><div class="choices"><button class="choice" data-correct="true">A　钻杆内部</button><button class="choice" data-correct="false">B　钻杆与孔壁之间</button></div><div class="feedback" role="status" aria-live="polite">观察动画后，点击一个选项。</div></section><section class="card" data-kind="reverse"><header><h2>反循环</h2><span class="badge">流向判断 02</span></header><img class="illustration" src="反循环.gif" alt="反循环钻孔示意：泥浆从钻杆与孔壁间下行，携渣从钻杆内上返"><div class="question">反循环时，携带钻渣的泥浆从哪里返回？</div><div class="choices"><button class="choice" data-correct="false">A　钻杆与孔壁之间</button><button class="choice" data-correct="true">B　钻杆内部</button></div><div class="feedback" role="status" aria-live="polite">观察动画后，点击一个选项。</div></section></div><div class="bottom" id="summary">蓝色：流向孔底的泥浆　　橙色：携带钻渣返回的泥浆</div></main><script>
for(const card of document.querySelectorAll('.card'))for(const btn of card.querySelectorAll('.choice'))btn.addEventListener('click',()=>{let good=btn.dataset.correct==='true';for(const b of card.querySelectorAll('.choice'))b.classList.remove('correct','incorrect');btn.classList.add(good?'correct':'incorrect');let f=card.querySelector('.feedback');f.className='feedback '+(good?'good':'bad');f.textContent=good?(card.dataset.kind==='positive'?'回答正确：正循环是钻杆内进、钻杆与孔壁之间返。':'回答正确：反循环是钻杆与孔壁之间进、钻杆内返。'):'再观察一下箭头的方向，再试一次。';card.dataset.done=good?'yes':'no';document.querySelector('#summary').textContent=[...document.querySelectorAll('.card')].every(c=>c.dataset.done==='yes')?'两题都答对了！正循环：杆内进；反循环：杆内返。':'蓝色：流向孔底的泥浆　　橙色：携带钻渣返回的泥浆'});document.querySelector('#reset').addEventListener('click',()=>{for(const card of document.querySelectorAll('.card')){card.dataset.done='no';for(const b of card.querySelectorAll('.choice'))b.classList.remove('correct','incorrect');let f=card.querySelector('.feedback');f.className='feedback';f.textContent='观察动画后，点击一个选项。'}document.querySelector('#summary').textContent='蓝色：流向孔底的泥浆　　橙色：携带钻渣返回的泥浆'});
</script></body></html>
