   if(!document.hidden)timer=setTimeout(()=>{
     if(!auto)return;
     holding=false;step=(step+1)%tour.length;choose(tour[step]);resetTimer(TICK);
   },delay);
 }else nextDue=0;
}
function setAuto(value){
 auto=value;holding=false;
 if(auto&&selected===null){step=tour.indexOf('S1');choose('S1');}
 else if(selected)step=tour.indexOf(selected);
 scene.classList.toggle('playing',auto);play.textContent=auto?'暂停轮播':'自动播放';
 play.setAttribute('aria-pressed',String(auto));document.body.dataset.autoplay=String(auto);
 updateStatus();resetTimer();
}
play.addEventListener('click',()=>setAuto(!auto));
document.getElementById('all').addEventListener('click',()=>{setAuto(false);choose(null);});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){clearTimeout(timer);timer=null;}
 else if(auto)resetTimer(nextDue?Math.max(0,nextDue-Date.now()):TICK);
});
new ResizeObserver(schedule).observe(map);window.addEventListener('resize',schedule);if(document.fonts)document.fonts.ready.then(schedule);
function honorMotion(){if(reduced.matches){svg.pauseAnimations();setAuto(false);}else svg.unpauseAnimations();}reduced.addEventListener('change',honorMotion);

function fitViewport(){
 const frame=document.getElementById('fit-frame');
 const w=frame.clientWidth,h=frame.clientHeight;
 if(!w||!h)return;
 const scale=Math.min(w/1360,h/600);
 scene.style.transform='scale('+scale+')';
 scene.style.left=((w-1360*scale)/2)+'px';
 scene.style.top=((h-600*scale)/2)+'px';
 scene.style.visibility='visible';
 document.body.dataset.fitWidth=String(w);document.body.dataset.fitHeight=String(h);document.body.dataset.fitScale=scale.toFixed(4);
 schedule();
}
new ResizeObserver(fitViewport).observe(document.getElementById('fit-frame'));
window.addEventListener('resize',fitViewport);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitViewport);
fitViewport();

choose('S1');setAuto(auto);honorMotion();
})();</script></body></html>
