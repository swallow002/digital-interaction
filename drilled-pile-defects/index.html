<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钻孔桩缺陷与防治 · 课堂挑战</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a30;color:#eef9ff;font:17px "Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:20px 3vw}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #315a76;padding-bottom:12px}h1{font-size:clamp(26px,3vw,42px);margin:0}header p{margin:6px 0 0;color:#9fc2d5}.tag{color:#76d8e5}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.panel{background:#102d49;border:1px solid #365f7b;border-radius:14px;padding:22px}h2{font-size:24px;margin:0 0 12px}.eyebrow{color:#6fe2f1;font-size:14px;letter-spacing:.12em}.scene{font-size:clamp(19px,1.8vw,25px);line-height:1.6;margin:12px 0}.prompt{font-weight:bold;margin:12px 0}.options{display:grid;gap:10px}button{font:inherit;cursor:pointer}.option{background:#173e5d;border:1px solid #45819a;color:white;border-radius:9px;padding:13px 15px;text-align:left;line-height:1.4}.option:hover,.option:focus-visible{outline:2px solid #6bdff0}.option.good{background:#155b4c;border-color:#6ce2b9}.option.bad{background:#583d30;border-color:#ffc18a}.result{border-radius:9px;background:#0c233a;color:#c5e3ed;padding:12px 15px;margin-top:12px;min-height:55px;line-height:1.5}.result.good{background:#10493d;color:#c5f7e5}.result.bad{background:#4c352b;color:#ffdebf}.btn{border:1px solid #4d8297;background:#143c59;color:white;border-radius:8px;padding:9px 14px}.btn:focus-visible{outline:3px solid white}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.controls button:disabled{opacity:.4;cursor:not-allowed}.progress{color:#9ed5e0;font-size:15px;margin-left:auto}.question-nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.question-nav button{border:1px solid #3b718a;border-radius:6px;background:#123854;color:#d9f3fa;min-width:40px;min-height:38px}.question-nav button.active{background:#087b80;border-color:#65e0dc}.question-nav button.done::after{content:" ✓";color:#9ff1ce}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.list button{background:#153c5b;border:1px solid #376a86;color:#e8f8fd;border-radius:8px;padding:10px;text-align:left}.list button.active{background:#087b80;border-color:#65e0dc}.detail{background:#0b233a;border-radius:9px;padding:14px;margin-top:12px;line-height:1.6}.detail h3{margin:0 0 5px;font-size:22px}.detail p{margin:7px 0;font-size:16px;color:#d4e8ee}.detail b{color:#83dce7}.detail-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,42%);gap:14px;align-items:start}.detail-figure{margin:0}.detail-figure img{display:block;width:100%;height:190px;object-fit:contain;background:#061727;border-radius:7px}.detail-figure figcaption{color:#9bbbc9;font-size:12px;line-height:1.4;margin-top:5px}@media(max-width:500px){.detail-content{grid-template-columns:1fr}.detail-figure img{height:180px}}footer{color:#93b3c5;font-size:13px;margin-top:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(min-width:851px) and (max-height:850px){main{padding-top:10px}.panel{padding:14px}.layout{margin-top:10px}.scene{font-size:19px;margin:7px 0}.option{padding:9px}.list button{padding:7px}.detail{padding:10px}.detail p{margin:4px 0}}
</style></head><body><main><header><div><div class="tag">高速铁路桥涵施工 · 课堂任务</div><h1>钻孔桩常见缺陷及防治</h1></div><button class="btn" id="reset">重新挑战</button></header><div class="layout"><section class="panel"><div class="eyebrow">现场情境 · 质量判断</div><div class="question-nav" id="questionNav" aria-label="选择题目"></div><h2 id="questionTitle"></h2><p class="scene" id="scene"></p><div class="prompt">如果你是施工技术员，应该如何判断或处理？</div><div class="options" id="options"></div><div id="result" class="result" role="status" aria-live="polite">请选择一项，判断后可以重新选择。</div><div class="controls"><button class="btn" id="prev">上一题</button><button class="btn" id="next">下一题</button><button class="btn" id="explain">查看解析</button><span class="progress" id="progress"></span></div></section><section class="panel"><div class="eyebrow">课堂资料 · 点击查看</div><h2>常见问题与防治</h2><div class="list" id="list"></div><article class="detail" id="detail" aria-live="polite"></article></section></div><footer>课堂示例依据教学课件整理；具体检测标准及处置以设计文件、适用规范和施工方案为准。</footer></main><script>
const data=[
{name:'桩位偏差',cause:['桩位地面放样不准确。','桩机就位不准确。'],fix:['桩位测放后复测、检查，确认每根桩的位置。','桩机就位后再次检查对中情况。']},
{name:'桩身倾斜',cause:['场地不平或松软，桩机安装不平稳。','钻进中遇地下障碍物或孤石。'],fix:['施工前平整、压实场地，确保桩机平稳。','查明并清除地下障碍物，钻进中检查垂直度。']},
{name:'桩身缩颈',cause:['孔壁坍塌导致局部孔径减小。','导管提升过快、过高，影响混凝土连续灌注。'],fix:['根据地层调整泥浆性能，做好护壁。','控制导管提升，保持合理埋深；课件参考范围为 2～6 m，具体按方案执行。']},
{name:'沉渣厚度超标',cause:['孔口堆土回落，或下放钢筋笼时碰撞孔壁。','成孔后未及时灌注，沉渣积聚。'],fix:['及时清理孔口堆土，平稳下放钢筋笼。','保证二次清孔质量，复测沉渣，合格后及时灌注。']},
{name:'钢筋笼上浮',cause:['提升导管时勾带钢筋笼。','混凝土上升产生的作用力使钢筋笼上浮。'],fix:['按方案固定钢筋笼，并检查导管与钢筋笼的关系。','混凝土接近笼底时适当放慢灌注，笼底进入混凝土后再恢复正常速度。']},
{name:'坍孔',cause:['泥浆护壁能力不足或孔内水头降低。','护筒埋置过浅、钻进过快或钻具碰撞孔壁。'],fix:['控制进尺，调整泥浆性能并维持足够水头。','查明坍孔位置，按方案回填并待密实后重钻；严重时需全部回填。']},
{name:'卡管',cause:['隔水栓或骨料堵塞导管。','设备故障、灌注延误或混凝土初凝。'],fix:['灌注前检修设备、准备备用设备，确保混凝土性能和连续供应。','针对堵塞原因采取抖动导管或振动等措施，并及时组织处理。']},
{name:'断桩',cause:['夹泥、沉渣或混凝土质量不良。','灌注中断、堵管或导管脱离混凝土面。'],fix:['清孔合格后及时连续灌注，控制混凝土质量和导管埋深。','发现缺陷后检测并分析，按设计及经批准的方案处理；课件列有冲刷法和嵌入式接桩法。']}
];
// Present classroom guidance without treating a treatment as universally applicable.
data[6].fix=['灌注前检查设备及混凝土供应条件。','出现堵管时先查明原因，按现场方案和专业人员要求处理。'];data[7].fix=['清孔符合要求后及时连续灌注，按方案控制导管埋深。','发现疑似缺陷后组织检测分析，按经批准的方案处理。'];data[2].fix=['结合地层及方案控制护壁条件。','按施工方案控制导管提升和埋深，发现异常及时分析。'];
const questions=[
{title:'桩位偏差：开钻前如何检查？',scene:'钻机就位后，复核发现钻头中心与设计桩位不一致。',options:['不必调整，钻进过程中自然会对准','调整钻机位置并重新对中，复核合格后开钻','直接加深钻孔，抵消桩位偏差'],answer:1,explain:'桩位测放和钻机对中都要复核，确认符合要求后再开钻。'},
{title:'桩身倾斜：怎样减少斜孔风险？',scene:'施工场地局部松软，钻机就位后出现不平稳。',options:['加快钻进，缩短钻机停留时间','只检查孔深，不必关注钻机状态','平整压实场地，调整钻机并检查垂直度'],answer:2,explain:'场地不平或松软可能引起钻机倾斜，应保证机身平稳并检查钻进垂直度。'},
{title:'桩身缩颈：怎样预防孔径不足？',scene:'某桩穿过易坍地层，施工人员担心局部孔壁失稳，导致桩身缩颈。',options:['结合地层调整护壁条件，并检查成孔质量','降低孔内水头，不再检查孔径','发现异常后继续施工，依靠多灌混凝土解决'],answer:0,explain:'应结合地层和施工方案控制泥浆护壁条件，检查孔径等成孔质量，发现异常及时处理。'},
{title:'沉渣超标：接下来怎么办？',scene:'钢筋笼和导管安装后，复测发现孔底沉渣超标。',options:['直接灌注混凝土，利用混凝土压实沉渣','按要求进行二次清孔，复测符合要求后及时灌注','继续加深钻孔，用增加孔深代替清孔'],answer:1,explain:'沉渣超标时应按要求清孔，复测合格后及时灌注；不能用加深孔深代替清孔。'},
{title:'钢筋笼上浮：怎样预防？',scene:'灌注过程中，混凝土面接近钢筋笼底部，施工人员需控制钢筋笼上浮风险。',options:['拆除钢筋笼定位装置，加快灌注','大幅提升导管，让导管脱离混凝土面','按方案固定钢筋笼，并在混凝土接近笼底时适当控制灌注速度'],answer:2,explain:'钢筋笼应按方案定位固定；混凝土接近笼底时控制灌注，避免冲击和导管勾带。'},
{title:'坍孔：发现异常如何应对？',scene:'钻进过程中孔内水位下降，泥浆中出现较多土块，怀疑孔壁坍塌。',options:['停止盲目钻进，及时报告并查明原因，按方案处置','继续高速钻进，尽快穿过异常地层','立即下放钢筋笼，借钢筋笼支撑孔壁'],answer:0,explain:'疑似坍孔应及时报告、查明情况，维持或恢复规定水头，并按施工方案组织处理。'},
{title:'卡管：灌注受阻怎么办？',scene:'水下混凝土灌注时，导管内混凝土下落受阻，出现疑似卡管。',options:['不查原因，反复猛提导管','及时报告并查明堵塞原因，按施工方案组织处理','停止关注导管，继续向孔内倾倒混凝土'],answer:1,explain:'疑似卡管应及时查明原因并按方案处置，避免盲目猛提导管造成更大质量风险。'},
{title:'断桩：疑似缺陷如何处理？',scene:'灌注过程曾发生较长时间中断，后续检测发现桩身完整性异常，怀疑断桩。',options:['只要桩顶外观正常就直接验收','未经分析直接在桩顶补浇混凝土','组织检测和原因分析，按设计及批准方案处理'],answer:2,explain:'疑似断桩应结合施工记录组织检测分析，并按设计和经批准的处理方案实施。'}
];
const list=document.querySelector('#list'),detail=document.querySelector('#detail'),result=document.querySelector('#result'),nav=document.querySelector('#questionNav'),options=document.querySelector('#options');
let current=-1,questionIndex=0,completed=new Set();
function renderDetail(){list.replaceChildren();data.forEach((item,i)=>{let b=document.createElement('button');b.textContent=item.name;b.className=i===current?'active':'';b.addEventListener('click',()=>{current=i;renderDetail()});list.append(b)});let d=data[current];detail.replaceChildren();if(!d){detail.textContent='点击上方问题名称，查看课件图片、常见原因与防治措施。';return}let h=document.createElement('h3');h.textContent=d.name;detail.append(h);let content=document.createElement('div');content.className='detail-content';let text=document.createElement('div');for(const [label,arr] of [['常见原因',d.cause],['防治要点',d.fix]]){let p=document.createElement('p'),b=document.createElement('b');b.textContent=label+'：';p.append(b,document.createTextNode(arr.join(' ')));text.append(p)}let figure=document.createElement('figure');figure.className='detail-figure';let img=document.createElement('img');img.src='images/'+(34+current)+'.jpg';img.alt=d.name+'相关课件图片';let caption=document.createElement('figcaption');caption.textContent='课件配图 · 结合文字分析';figure.append(img,caption);content.append(text,figure);detail.append(content)}
function renderQuestion(){let q=questions[questionIndex];document.querySelector('#questionTitle').textContent=q.title;document.querySelector('#scene').textContent=q.scene;document.querySelector('#progress').textContent=`第 ${questionIndex+1} / ${questions.length} 题 · 已答对 ${completed.size} 题`;document.querySelector('#prev').disabled=questionIndex===0;document.querySelector('#next').disabled=questionIndex===questions.length-1;result.className='result';result.textContent='请选择一项，判断后可以重新选择。';nav.replaceChildren();questions.forEach((item,i)=>{let b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label',`第 ${i+1} 题 ${data[i].name}`);b.className=(i===questionIndex?'active ':'')+(completed.has(i)?'done':'');b.addEventListener('click',()=>{questionIndex=i;renderQuestion()});nav.append(b)});options.replaceChildren();q.options.forEach((text,i)=>{let b=document.createElement('button');b.className='option';b.textContent='ABC'[i]+'　'+text;b.addEventListener('click',()=>{options.querySelectorAll('button').forEach(x=>x.classList.remove('good','bad'));let ok=i===q.answer;b.classList.add(ok?'good':'bad');result.className='result '+(ok?'good':'bad');result.textContent=ok?'回答正确：'+q.explain:'再想一想，结合施工环节和质量控制要求重新选择。';if(ok){completed.add(questionIndex);document.querySelector('#progress').textContent=`第 ${questionIndex+1} / ${questions.length} 题 · 已答对 ${completed.size} 题`;nav.children[questionIndex].classList.add('done')}});options.append(b)})}
document.querySelector('#prev').addEventListener('click',()=>{if(questionIndex>0){questionIndex--;renderQuestion()}});document.querySelector('#next').addEventListener('click',()=>{if(questionIndex<questions.length-1){questionIndex++;renderQuestion()}});document.querySelector('#explain').addEventListener('click',()=>{let q=questions[questionIndex];result.className='result good';result.textContent='参考答案：'+('ABC'[q.answer])+'。'+q.explain});document.querySelector('#reset').addEventListener('click',()=>{completed.clear();questionIndex=0;current=-1;renderQuestion();renderDetail()});renderQuestion();renderDetail();
</script></body></html>
