<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钻孔桩缺陷与防治 · 课堂挑战</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a30;color:#eef9ff;font:17px "Microsoft YaHei",sans-serif}main{max-width:1500px;margin:auto;padding:20px 3vw}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #315a76;padding-bottom:12px}h1{font-size:clamp(26px,3vw,42px);margin:0}header p{margin:6px 0 0;color:#9fc2d5}.tag{color:#76d8e5}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.panel{background:#102d49;border:1px solid #365f7b;border-radius:14px;padding:22px}h2{font-size:24px;margin:0 0 12px}.eyebrow{color:#6fe2f1;font-size:14px;letter-spacing:.12em}.scene{font-size:clamp(19px,1.8vw,25px);line-height:1.6;margin:12px 0}.prompt{font-weight:bold;margin:12px 0}.options{display:grid;gap:10px}button{font:inherit;cursor:pointer}.option{background:#173e5d;border:1px solid #45819a;color:white;border-radius:9px;padding:13px 15px;text-align:left;line-height:1.4}.option:hover,.option:focus-visible{outline:2px solid #6bdff0}.option.good{background:#155b4c;border-color:#6ce2b9}.option.bad{background:#583d30;border-color:#ffc18a}.result{border-radius:9px;background:#0c233a;color:#c5e3ed;padding:12px 15px;margin-top:12px;min-height:55px;line-height:1.5}.result.good{background:#10493d;color:#c5f7e5}.result.bad{background:#4c352b;color:#ffdebf}.btn{border:1px solid #4d8297;background:#143c59;color:white;border-radius:8px;padding:9px 14px}.btn:focus-visible{outline:3px solid white}.controls{display:flex;gap:10px;align-items:center;margin-top:12px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.list button{background:#153c5b;border:1px solid #376a86;color:#e8f8fd;border-radius:8px;padding:10px;text-align:left}.list button.active{background:#087b80;border-color:#65e0dc}.detail{background:#0b233a;border-radius:9px;padding:14px;margin-top:12px;line-height:1.6}.detail h3{margin:0 0 5px;font-size:22px}.detail p{margin:7px 0;font-size:16px;color:#d4e8ee}.detail b{color:#83dce7}.detail-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,42%);gap:14px;align-items:start}.detail-figure{margin:0}.detail-figure img{display:block;width:100%;height:190px;object-fit:contain;background:#061727;border-radius:7px}.detail-figure figcaption{color:#9bbbc9;font-size:12px;line-height:1.4;margin-top:5px}@media(max-width:500px){.detail-content{grid-template-columns:1fr}.detail-figure img{height:180px}}footer{color:#93b3c5;font-size:13px;margin-top:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(min-width:851px) and (max-height:850px){main{padding-top:10px}.panel{padding:14px}.layout{margin-top:10px}.scene{font-size:19px;margin:7px 0}.option{padding:9px}.list button{padding:7px}.detail{padding:10px}.detail p{margin:4px 0}}
</style></head><body><main><header><div><div class="tag">高速铁路桥涵施工 · 课堂任务</div><h1>钻孔桩常见缺陷及防治</h1></div><button class="btn" id="reset">重新挑战</button></header><div class="layout"><section class="panel"><div class="eyebrow">现场情境 · 质量判断</div><h2>沉渣超标，接下来怎么办？</h2><p class="scene">钢筋笼和导管安装后，复测发现孔底沉渣超标。</p><div class="prompt">如果你是施工技术员，接下来应怎么做？</div><div class="options"><button class="option" data-correct="false">A　直接灌注混凝土，利用混凝土压实沉渣</button><button class="option" data-correct="true">B　按要求进行二次清孔，复测符合要求后及时灌注</button><button class="option" data-correct="false">C　继续加深钻孔，用增加孔深代替清孔</button></div><div id="result" class="result" role="status" aria-live="polite">请选择一项，判断后可以重新选择。</div><div class="controls"><button class="btn" id="explain">查看解析</button></div></section><section class="panel"><div class="eyebrow">课堂资料 · 点击查看</div><h2>常见问题与防治</h2><div class="list" id="list"></div><article class="detail" id="detail" aria-live="polite"></article></section></div><footer>课堂示例依据教学课件整理；具体检测标准及处置以设计文件、适用规范和施工方案为准。</footer></main><script>
const data=[
{name:'桩位偏差',cause:['桩位地面放样不准确。','桩机就位不准确。'],fix:['桩位测放后复测、检查，确认每根桩的位置。','桩机就位后再次检查对中情况。']},
{name:'桩身倾斜',cause:['场地不平或松软，桩机安装不平稳。','钻进中遇地下障碍物或孤石。'],fix:['施工前平整、压实场地，确保桩机平稳。','查明并清除地下障碍物，钻进中检查垂直度。']},
{name:'桩身缩颈',cause:['孔壁坍塌导致局部孔径减小。','导管提升过快、过高，影响混凝土连续灌注。'],fix:['根据地层调整泥浆性能，做好护壁。','控制导管提升，保持合理埋深；课件参考范围为 2～6 m，具体按方案执行。']},
{name:'沉渣厚度超标',cause:['孔口堆土回落，或下放钢筋笼时碰撞孔壁。','成孔后未及时灌注，沉渣积聚。'],fix:['及时清理孔口堆土，平稳下放钢筋笼。','保证二次清孔质量，复测沉渣，合格后及时灌注。']},
{name:'钢筋笼上浮',cause:['提升导管时勾带钢筋笼。','混凝土上升产生的作用力使钢筋笼上浮。'],fix:['按方案固定钢筋笼，并检查导管与钢筋笼的关系。','混凝土接近笼底时适当放慢灌注，笼底进入混凝土后再恢复正常速度。']},
{name:'坍孔',cause:['泥浆护壁能力不足或孔内水头降低。','护筒埋置过浅、钻进过快或钻具碰撞孔壁。'],fix:['控制进尺，调整泥浆性能并维持足够水头。','查明坍孔位置，按方案回填并待密实后重钻；严重时需全部回填。']},
{name:'卡管',cause:['隔水栓或骨料堵塞导管。','设备故障、灌注延误或混凝土初凝。'],fix:['灌注前检修设备、准备备用设备，确保混凝土性能和连续供应。','针对堵塞原因采取抖动导管或振动等措施，并及时组织处理。']},
{name:'断桩',cause:['夹泥、沉渣或混凝土质量不良。','灌注中断、堵管或导管脱离混凝土面。'],fix:['清孔合格后及时连续灌注，控制混凝土质量和导管埋深。','发现缺陷后检测并分析，按设计及经批准的方案处理；课件列有冲刷法和嵌入式接桩法。']}
];
// Present classroom guidance without treating a treatment as universally applicable.
data[6].fix=['灌注前检查设备及混凝土供应条件。','出现堵管时先查明原因，按现场方案和专业人员要求处理。'];data[7].fix=['清孔符合要求后及时连续灌注，按方案控制导管埋深。','发现疑似缺陷后组织检测分析，按经批准的方案处理。'];data[2].fix=['结合地层及方案控制护壁条件。','按施工方案控制导管提升和埋深，发现异常及时分析。'];
const list=document.querySelector('#list'),detail=document.querySelector('#detail'),result=document.querySelector('#result');let current=-1;function render(){list.replaceChildren();data.forEach((item,i)=>{let b=document.createElement('button');b.textContent=item.name;b.className=i===current?'active':'';b.addEventListener('click',()=>{current=i;render()});list.append(b)});let d=data[current];detail.replaceChildren();if(!d){detail.textContent='请先完成左侧判断；也可点击上方名称查阅原因与防治。';return}let h=document.createElement('h3');h.textContent=d.name;detail.append(h);let content=document.createElement('div');content.className='detail-content';let text=document.createElement('div');for(const [label,arr] of [['常见原因',d.cause],['防治要点',d.fix]]){let p=document.createElement('p'),b=document.createElement('b');b.textContent=label+'：';p.append(b,document.createTextNode(arr.join(' ')));text.append(p)}let figure=document.createElement('figure');figure.className='detail-figure';let img=document.createElement('img');img.src='images/'+(34+current)+'.jpg';img.alt=d.name+'相关课件图片';let caption=document.createElement('figcaption');caption.textContent='课件配图 · 结合文字分析';figure.append(img,caption);content.append(text,figure);detail.append(content)}
for(const b of document.querySelectorAll('.option'))b.addEventListener('click',()=>{for(const x of document.querySelectorAll('.option'))x.classList.remove('good','bad');let ok=b.dataset.correct==='true';b.classList.add(ok?'good':'bad');result.className='result '+(ok?'good':'bad');result.textContent=ok?'回答正确：按要求二次清孔，复测符合要求后及时灌注。':'再想一想：结合刚学过的清孔要求，再选择一次。'});document.querySelector('#explain').addEventListener('click',()=>{result.className='result good';result.textContent='参考答案：B。钢筋笼与导管安装后复测沉渣，按要求二次清孔；复测符合要求后及时灌注。'});document.querySelector('#reset').addEventListener('click',()=>{for(const b of document.querySelectorAll('.option'))b.classList.remove('good','bad');result.className='result';result.textContent='请选择一项，判断后可以重新选择。';current=-1;render()});render();
</script></body></html>
